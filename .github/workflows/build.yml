      # ==================== Collect Patch Reject Files ====================
      # Collect all .rej files for patch debugging
      - name: Collect Patch Reject Files
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # ==================== Upload Build Artifacts ====================
      # Upload AnyKernel3 zip package
      # compression-level=0 avoids double compression on AK3 zip
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BUILD_VARIANT }}_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
#            *.img
          compression-level: 0

      # ==================== Upload Patch Rejects ====================
      - name: Upload Patch Rejects
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BUILD_VARIANT }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
